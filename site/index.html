<style>
:root{--bg:#f6f3ee;--ink:#1d1b18;--mut:#5f594f;--line:#d9d1c4;--acc:#b3412b;--accbg:#f7e6e1;--card:#fffdf9;--soft:#efe9df}

const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

function begin(){order=shuf(Q.map((q,n)=>({...q,n,o:q.o&&(q.keep?q.o:shuf(q.o)),r:q.r&&shuf(q.r)})));ans={};i=0;render()}
const hd=(k,t)=>`<div class="top"><span class="brand">29·N</span><div class="bar" role="progressbar" aria-label="Progreso" aria-valuenow="${k}" aria-valuemax="${t}"><i style="width:${k/t*100}%"></i></div><span>${Math.min(k+1,t)} / ${t}</span></div>`;
const P=on=>`aria-pressed="${!!on}"`;

function show(){
  if(i>=order.length)return about();
  const q=order[i],a=ans[q.n];
  let h=hd(i,order.length)+`<h2 class="q" id="qt" tabindex="-1">${esc(q.t)}</h2>${q.h?`<p class="hint">${esc(q.h)}</p>`:''}<div class="qa" role="group" aria-labelledby="qt">`;

  }else if(q.k==='lik'){
    h+=`<div class="lk">${LK.map((l,v)=>`<button class="opt" ${P(a===v-2)} onclick="pick(${v-2})">${l}</button>`).join('')}</div>`;

    const s=a||[];h+=`<p class="hint" aria-live="polite">${s.length} de ${q.max} elegidos</p><div class="${s.length>=q.max?'full':''}">`+q.o.map((o,j)=>`<button class="opt" ${P(s.includes(o[0]))} onclick="multi(${j})"><span class="ck" aria-hidden="true">✓</span>${esc(o[0])}</button>`).join('')+'</div>';
  }else{
    h+=q.o.map((o,j)=>`<button class="opt" ${P(a===o[0])} onclick="pick(${j})">${esc(o[0])}</button>`).join('');

  h+='</div>';
  const multiStep=q.k==='grid'||q.k==='pick';

  return h;
}
function render(){const h=show();if(h){paint(h);$('#qt')?.focus?.({preventScroll:true})}}

function grid(j,v){const q=order[i];(ans[q.n]??={})[q.r[j][0]]=v;render0()}
function multi(j){const q=order[i],s=ans[q.n]??=[],t=q.o[j][0],k=s.indexOf(t);k<0?(s.length<q.max&&s.push(t)):s.splice(k,1);render0()}
function next(){i++;render()}
function skip(){delete ans[order[i].n];next()}
function back(){if(i>0){i--;render()}}

function about(){
  paint(hd(order.length,order.length)+`<h2 class="q">Por último, dos datos para ajustar el resultado</h2>
  <label>¿Dónde votas?<select id="reg"><option value="">Prefiero no decirlo</option>${Object.entries(REG).map(([k,v])=>`<option value="${k}" ${k===reg?'selected':''}>${v}</option>`).join('')}</select></label>
  <label>¿Qué partido tenías pensado votar? <span class="mut" style="font-weight:normal">(opcional; no cambia el cálculo, solo lo compara)</span><select id="prev"><option value="">No lo sé / prefiero no decirlo</option>${Object.entries(DATA).map(([k,p])=>`<option value="${k}" ${k===prev?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
  <div class="nav"><button class="lnk" onclick="i--;render()">← Atrás</button><button class="go" onclick="reg=$('#reg').value;prev=$('#prev').value;results()">Ver resultado →</button></div>`);
}

function profile(){ // user position per dim = weighted mean of answer contributions
  const acc={},add=(e,x)=>{for(const[d,[v,w]]of Object.entries(e)){const a=acc[d]??={s:0,w:0};a.s+=(x===undefined?v:x*v)*w;a.w+=w}};
  Q.forEach((q,n)=>{const a=ans[n];if(a===undefined)return;
    if(q.k==='grid')q.r.forEach(r=>a[r[0]]&&add(r[1],a[r[0]]-3));
    else if(q.k==='lik')add(q.e,a);
    else if(q.k==='pick')q.o.forEach(o=>a.includes(o[0])&&add(o[1]));
    else add(q.o.find(o=>o[0]===a)[1]);});
  const u={};for(const[d,a]of Object.entries(acc))u[d]={v:a.s/a.w,w:a.w};return u;
}
// For grid/likert e[d]=[sign,w] and x is the answer (-2..2): contribution x*sign. For options e[d]=[value,w].

function match(u,p){
  let num=0,den=0;const per=[];
  for(const[d,x]of Object.entries(u)){const pd=p.dims[d];if(!pd||pd.score==null)continue;
    const W=Math.sqrt(x.w)*({high:1,med:.85,low:.6}[pd.conf]??.6),diff=Math.abs(x.v-pd.score);
    num+=W*diff;den+=W*4;per.push({d,diff,W,u:x.v,p:pd});}
  const s=den?1-num/den:0;return{s,pct:Math.round(100*s),per};
}

let last=[];
function results(){
  const u=profile(),n=Object.keys(ans).length;
  const rows=last=Object.entries(DATA).map(([k,p])=>({k,p,...match(u,p),here:!p.regions||!reg||p.regions.includes(reg)}))
    .filter(r=>r.here).sort((a,b)=>b.s-a.s);
  const pos=rows.findIndex(r=>r.k===prev),t=rows[0];
  const pole=x=>Math.abs(x.u)<.5?'posición intermedia':'tiendes a «'+(x.u<0?DIMS[x.d][1]:DIMS[x.d][2])+'»';
  const li=x=>`<li><b>${DIMS[x.d][0]}</b><small>Tú: ${pole(x)}</small>Programa: ${esc(x.p.evidence)}${x.p.src==='inferred'?' <span class="tag">(inferido, no explícito en el programa)</span>':''}</li>`;
  let h=`<span class="brand">29·N</span><h1>Tu afinidad</h1><p class="mut">Según ${n} respuestas${reg?' · partidos que se presentan en '+REG[reg]:''}.</p>`;
  if(n<8)h+=`<div class="note">Has contestado pocas preguntas; el resultado es poco fiable.</div>`;
  h+=`<section class="hero" style="--pc:${t.p.color}"><div class="mut">El programa más cercano a tus respuestas</div><h2>${esc(t.p.name)}</h2><div class="big">${t.pct}%</div><div class="t"><i style="width:${t.pct}%;background:${t.p.color}"></i></div>
  <p class="mut">Le siguen ${rows.slice(1,3).map(r=>`${esc(r.p.name)} (${r.pct}%)`).join(' y ')}.</p>
  <div class="nav"><a href="#p0" onclick="$('#p0').open=true">¿Por qué? ↓</a><button class="go go2" onclick="share(this)">Compartir</button></div></section>`;
  if(prev&&pos>=0)h+=`<div class="note">Tenías pensado votar a <b>${esc(DATA[prev].name)}</b>: queda en el puesto <b>${pos+1}</b> de ${rows.length} (${rows[pos].pct}%).${pos?'':' Coincide con tu mejor resultado.'}</div>`;
  h+=`<h3>Todos los programas</h3><p class="mut">Toca un partido para ver dónde coincidís y dónde no, con la página del programa de la que sale cada posición.</p>`;
  h+=rows.map((r,j)=>{const p=r.p,by=r.per.slice().sort((a,b)=>a.diff-b.diff),ag=by.filter(x=>x.diff<=1).slice(0,4),dis=by.filter(x=>x.diff>=1.5).reverse().slice(0,4);
    return `<details class="party" id="p${j}"><summary><div class="pt"><span class="rk">${j+1}</span><b>${esc(p.name)}${p.regions&&!reg?` <span class="tag">solo ${p.regions.map(x=>REG[x]).join(', ')}</span>`:''}</b><span>${r.pct}%</span></div><div class="t"><i style="width:${r.pct}%;background:${p.color}"></i></div></summary>
    <div class="pd"><p>${esc(p.summary)}</p>
    ${ag.length?`<h4>Dónde coincidís</h4><ul class="ag">${ag.map(li).join('')}</ul>`:''}
    ${dis.length?`<h4>Dónde discrepáis</h4><ul class="dg">${dis.map(li).join('')}</ul>`:''}
    <h4>Tú frente a ${esc(p.name)}, eje a eje</h4>${chart(r.per,p.color)}
    <details class="inner"><summary>Ejes y propuestas del programa</summary>
    <h4>Ejes del programa</h4><ul class="b">${p.fundamentals.map(f=>`<li>${esc(f)}</li>`).join('')}</ul>
    <h4>Propuestas destacadas</h4><ul class="b">${p.signature.map(s=>`<li>${esc(s.text)} <span class="tag">${esc(s.page)}</span></li>`).join('')}</ul></details>
    <p class="mut">Fuente: <a href="${esc(p.url)}" rel="noreferrer noopener" target="_blank">${esc(p.title||'programa electoral')}</a>${p.pages?` (${p.pages} págs.)`:''}${p.src_note?`<br><span class="tag">${esc(p.src_note)}</span>`:''}</p></div></details>`}).join('');
  h+=how()+`
  <div class="nav"><button class="lnk" onclick="about()">← Cambiar comunidad</button><button class="go" onclick="start()">Repetir</button></div>`;
  paint(h);
}
const pg=p=>p.pages?p.pages+' págs.':'web, sin paginar';
function how(){ // methodology, shared by intro and results; parties in alphabetical order
  return `<details class="how" id="how"><summary>Cómo está hecho: fuentes, método y límites</summary>
  <h3>Fuentes</h3><p>Los programas electorales del 29-N, descargados de la web oficial de cada partido o de su campaña y leídos enteros, página a página (no resúmenes de prensa).</p>
  <ul class="src">${Object.values(DATA).sort((a,b)=>a.name.localeCompare(b.name,'es')).map(p=>`<li><a href="${esc(p.url)}" rel="noreferrer noopener" target="_blank">${esc(p.name)}</a> <span class="tag">${pg(p)}</span></li>`).join('')}</ul>
  <h3>Método</h3><p>Cada respuesta suma, con distinto peso, a uno o varios de 21 ejes (impuestos, vivienda, inmigración, modelo territorial…). Muchas preguntas son indirectas: la confianza en las instituciones o cómo repartes un presupuesto dicen mucho sin preguntarlo a las claras.</p>
  <p>Cada programa se puntúa en los 21 ejes de −2 a +2, y cada puntuación cita la página de la que sale. Si un programa no dice nada sobre un eje, la posición se deduce de otros datos, se marca como «inferido» y pesa menos. La afinidad es la distancia media, ponderada, entre tus posiciones y las de cada programa.</p>
  <h3>Neutralidad</h3><p>Las preguntas no nombran partidos. Preguntas y opciones salen en orden aleatorio. Todos los partidos se miden con los mismos ejes y el mismo cálculo. Esta página no recomienda ningún voto.</p>
  <h3>Límites</h3><p>21 ejes simplifican mucho. Un programa dice lo que un partido promete, no lo que ha votado ni lo que hará. Puede haber errores: consulta los programas enlazados.</p></details>`;
}
async function share(b){ // ponytail: native share sheet or clipboard; no network
  const t=`Mi afinidad con los programas del 29-N:\n${last.slice(0,3).map((r,j)=>`${j+1}. ${r.p.name}: ${r.pct}%`).join('\n')}\n${location.href.split('#')[0]}`;
  try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);b.textContent='Copiado ✓'}}
  catch(e){if(e.name!=='AbortError')prompt('Copia el texto:',t)}
}
function chart(per,c){ // dot plot: ● you, ■ party, on -2..+2
  return `<p class="mut"><span aria-hidden="true">●</span> tú &nbsp; <span style="color:${c}" aria-hidden="true">■</span> programa · la línea central es la posición neutra</p>`+per.sort((a,b)=>b.W-a.W).map(x=>`<div class="dim" role="img" aria-label="${DIMS[x.d][0]}: tú ${x.u.toFixed(1)}, programa ${x.p.score}, en escala de −2 (${DIMS[x.d][1]}) a +2 (${DIMS[x.d][2]})"><b>${DIMS[x.d][0]}</b><div class="trk">
  <i style="left:${(x.p.score+2)*25}%;background:${c};border-radius:2px"></i><i style="left:${(x.u+2)*25}%;background:var(--ink);border:2px solid var(--card)"></i></div><div class="pol" aria-hidden="true"><span>${DIMS[x.d][1]}</span><span>${DIMS[x.d][2]}</span></div></div>`).join('');
}
start();
</script>
